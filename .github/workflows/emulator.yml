# Runs the real APK on an Android emulator (a Pixel-class device with an emulated punch-hole cutout):
# grants permissions, walks the settings app, drives the overlay through every test event, and keeps
# screenshots + a screen recording. Software-rendered emulator: judge layout, not frame rate.
name: Run on emulator

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Build debug APK
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash .github/scripts/emulator-run.sh

      - name: Upload run (screenshots, video, logcat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flux-emulator-run
          path: device-run/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish screenshots to branch ci-device
        if: always() && hashFiles('device-run/*.png') != ''
        run: |
          set -e
          sha=$(git rev-parse --short HEAD)
          mkdir -p /tmp/shots && cp device-run/*.png /tmp/shots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan device-tmp
          cp /tmp/shots/*.png .
          echo "Emulator screenshots from commit $sha (generated; do not edit)." > README.md
          git add -- *.png README.md
          git commit -q -m "Emulator screenshots for $sha"
          git push --force origin HEAD:refs/heads/ci-device
