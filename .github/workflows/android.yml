# Builds Galaxy Pulse on GitHub's runners (which ship the Android SDK) and publishes the APK as a
# workflow artifact. Local reproduction: ./gradlew testDebugUnitTest assembleDebug lintDebug
name: Android build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: bash ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Assemble debug APK
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug

      - name: APK summary (size, signature, checksum)
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          ls -l "$apk"
          sha256sum "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | head -3

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: galaxy-pulse-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Lint
        run: bash ./gradlew --no-daemon --stacktrace lintDebug

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
