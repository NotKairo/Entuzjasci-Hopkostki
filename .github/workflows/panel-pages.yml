# Publikuje panel/public na gałęzi gh-pages (GitHub Pages: https://notkairo.github.io/Entuzjasci-Hopkostki/).
name: Panel na GitHub Pages

on:
  push:
    branches: [main]
    paths: ['panel/public/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: panel-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wypchnij panel/public na gh-pages
        working-directory: panel/public
        env:
          TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Panel z ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
